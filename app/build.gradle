plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videocollector.app'
    compileSdk 35

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }

    defaultConfig {
        applicationId "com.videocollector.app"
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName "7.1.0"
    }
}

dependencies {
    implementation files('libs/nativecore-classes.jar')
}
