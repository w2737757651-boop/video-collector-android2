name: Build WangParser APK V7.0.3 Free Local

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | bash "$SDKMANAGER" --licenses || true
          bash "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install gomobile toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Prepare Go module for gomobile
        run: |
          cd nativecore

          # Go 1.24+ / current gomobile requires x/mobile/gobind
          # to be recorded in the CURRENT MODULE dependency graph.
          go get -tool golang.org/x/mobile/cmd/gobind@latest

          go mod tidy

          echo "=== go.mod ==="
          cat go.mod

          echo "=== x/mobile module ==="
          go list -m golang.org/x/mobile

          echo "=== Go compile preflight ==="
          go test ./...

      - name: Build Go Android binding
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs

          cd nativecore

          gomobile bind \
            -target=android/arm64,android/amd64 \
            -androidapi 23 \
            -javapkg com.videocollector.go \
            -trimpath \
            -o ../app/libs/nativecore.aar \
            .

          cd ..

          test -f app/libs/nativecore.aar

          echo "=== nativecore.aar ==="
          ls -lh app/libs/nativecore.aar
          unzip -l app/libs/nativecore.aar | sed -n '1,180p'

      - name: Extract clean Go classes and JNI libraries
        run: |
          rm -rf /tmp/nativecore-aar
          rm -rf /tmp/nativecore-classes
          mkdir -p /tmp/nativecore-aar
          mkdir -p /tmp/nativecore-classes

          unzip -q app/libs/nativecore.aar -d /tmp/nativecore-aar

          test -f /tmp/nativecore-aar/classes.jar
          test -d /tmp/nativecore-aar/jni

          cd /tmp/nativecore-classes
          jar xf /tmp/nativecore-aar/classes.jar

          echo "=== Non-class resources before cleanup ==="
          find . -type f ! -name '*.class' -print || true

          # Avoid :app:mergeDebugJavaResource collisions.
          find . -type f ! -name '*.class' -delete
          find . -type d -empty -delete || true

          jar cf "$GITHUB_WORKSPACE/app/libs/nativecore-classes.jar" .

          cd "$GITHUB_WORKSPACE"

          NON_CLASS="$(jar tf app/libs/nativecore-classes.jar \
            | grep -v '/$' \
            | grep -v '\.class$' \
            || true)"

          if [ -n "$NON_CLASS" ]; then
            echo "ERROR: Clean JAR still contains non-class resources:"
            echo "$NON_CLASS"
            exit 1
          fi

          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs
          cp -R /tmp/nativecore-aar/jni/. app/src/main/jniLibs/

          echo "=== JNI libraries ==="
          find app/src/main/jniLibs -type f -name '*.so' -print

          rm -f app/libs/nativecore.aar

      - name: Detect generated Java binding class
        run: |
          echo "=== Generated classes ==="
          jar tf app/libs/nativecore-classes.jar | sed -n '1,180p'

          CLASS_PATH="$(jar tf app/libs/nativecore-classes.jar \
            | grep -E '(^|/)Nativecore\.class$' \
            | grep -v '\$' \
            | head -n 1 \
            | sed 's#/#.#g; s#\.class$##')"

          if [ -z "$CLASS_PATH" ]; then
            CLASS_PATH="$(jar tf app/libs/nativecore-classes.jar \
              | grep '^com/videocollector/go/.*\.class$' \
              | grep -v '\$' \
              | head -n 1 \
              | sed 's#/#.#g; s#\.class$##')"
          fi

          if [ -z "$CLASS_PATH" ]; then
            echo "ERROR: Could not detect gomobile binding class."
            exit 1
          fi

          echo "Native binding class: $CLASS_PATH"
          printf '%s' "$CLASS_PATH" > app/src/main/assets/native_class.txt

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android native inputs
        run: |
          test -f app/libs/nativecore-classes.jar

          JNI_COUNT="$(find app/src/main/jniLibs -type f -name '*.so' | wc -l)"
          echo "JNI .so count: $JNI_COUNT"

          if [ "$JNI_COUNT" -lt 1 ]; then
            echo "ERROR: No JNI libraries found."
            exit 1
          fi

          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo "=== app name ==="
          cat app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          gradle :app:clean :app:assembleDebug \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WangParser-APK-V703-FREE-LOCAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
