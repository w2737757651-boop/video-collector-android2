          unzip -l app/libs/nativecore.aar

      - name: Extract Go classes and JNI libraries
        run: |
          rm -rf /tmp/nativecore-aar
          mkdir -p /tmp/nativecore-aar

          unzip -q app/libs/nativecore.aar -d /tmp/nativecore-aar

          test -f /tmp/nativecore-aar/classes.jar

          rm -rf /tmp/nativecore-classes
          mkdir -p /tmp/nativecore-classes

          cd /tmp/nativecore-classes
          jar xf /tmp/nativecore-aar/classes.jar

          echo "=== Original Java resources ==="
          find . -type f ! -name '*.class' -print || true

          # Keep only Java bytecode.
          # gomobile binding does not need META-INF/LICENSE/NOTICE/etc at runtime.
          find . -type f ! -name '*.class' -delete
          find . -type d -empty -delete || true

          jar cf "$GITHUB_WORKSPACE/app/libs/nativecore-classes.jar" .

          cd "$GITHUB_WORKSPACE"

          echo "=== Clean binding JAR contents ==="
          jar tf app/libs/nativecore-classes.jar | sed -n '1,160p'

          # Fail if any non-class Java resource remains.
          NON_CLASS="$(jar tf app/libs/nativecore-classes.jar \
            | grep -v '/$' \
            | grep -v '\.class$' \
            || true)"

          if [ -n "$NON_CLASS" ]; then
            echo "ERROR: Clean JAR still contains non-class resources:"
            echo "$NON_CLASS"
            exit 1
          fi

          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main/jniLibs

          if [ -d /tmp/nativecore-aar/jni ]; then
            cp -R /tmp/nativecore-aar/jni/. app/src/main/jniLibs/
          else
            echo "ERROR: gomobile AAR has no jni directory"
            find /tmp/nativecore-aar -maxdepth 4 -type f -print
            exit 1
          fi

          echo "=== Extracted JNI libraries ==="
          find app/src/main/jniLibs -type f -print

          rm -f app/libs/nativecore.aar

      - name: Detect generated Java binding class
        run: |
          CLASS_PATH="$(jar tf app/libs/nativecore-classes.jar \
            | grep -E '(^|/)Nativecore\.class$' \
            | grep -v '\$' \
            | head -n 1 \
            | sed 's#/#.#g; s#\.class$##')"

          if [ -z "$CLASS_PATH" ]; then
            CLASS_PATH="$(jar tf app/libs/nativecore-classes.jar \
              | grep '^com/videocollector/go/.*\.class$' \
              | grep -v '\$' \
              | head -n 1 \
              | sed 's#/#.#g; s#\.class$##')"
          fi

          if [ -z "$CLASS_PATH" ]; then
            echo "ERROR: Could not detect gomobile binding class."
            exit 1
          fi

          echo "Native binding class: $CLASS_PATH"
          printf '%s' "$CLASS_PATH" > app/src/main/assets/native_class.txt

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android native inputs
        run: |
          test -f app/libs/nativecore-classes.jar

          JNI_COUNT="$(find app/src/main/jniLibs -type f -name '*.so' | wc -l)"
          echo "JNI .so count: $JNI_COUNT"

          if [ "$JNI_COUNT" -lt 1 ]; then
            echo "ERROR: No JNI libraries found."
            exit 1
          fi

          echo "=== app/build.gradle ==="
          cat app/build.gradle

      - name: Build APK
        run: |
          gradle :app:clean :app:assembleDebug \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCollector-APK-V702-FREE-LOCAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
