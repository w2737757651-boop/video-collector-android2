<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>王的解析</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 16px 100px}
h1{font-size:34px;margin:0 0 8px}
.sub{color:#9aa4ae;line-height:1.7;margin-bottom:18px}
.card{background:#181d23;border:1px solid #2a333c;border-radius:18px;padding:16px;margin-bottom:14px}
textarea{width:100%;height:150px;border:1px solid #36414c;border-radius:14px;background:#0f1317;color:#fff;padding:14px;font-size:16px;resize:vertical}
button,.btn{border:0;border-radius:12px;min-height:48px;padding:0 15px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.toolbar{display:flex;gap:10px;margin-top:12px}
.tool{flex:1;background:#29323b;color:#fff}
.primary{width:100%;background:#fff;color:#111;margin-top:12px}
.primary:disabled{opacity:.55}
.action{width:100%;background:#fff;color:#111;margin-top:10px}
.action.red{background:#ff3158;color:#fff}
.action.dark{background:#29323b;color:#fff}
.action.green{background:#1f8f5f;color:#fff}
.badge{display:inline-block;padding:5px 9px;background:#242c34;border-radius:20px;margin:10px 4px 0 0;color:#aeb8c2;font-size:12px}
.tip{background:#202832;border-radius:12px;padding:13px;margin-top:12px;color:#b8c2cc;line-height:1.7}
.warn{background:#30252a;border:1px solid #5a353e;color:#ffb5bd;border-radius:12px;padding:13px;margin-top:12px;line-height:1.7}
.ok{background:#1e3029;border:1px solid #2d5d48;color:#a8e5c8;border-radius:12px;padding:13px;margin-top:12px;line-height:1.7}
.hidden{display:none}
.err{color:#ff9292;white-space:pre-wrap;line-height:1.7}
.status{color:#d4dde5;white-space:pre-wrap;line-height:1.7}
.title{font-size:19px;font-weight:700;line-height:1.45;margin:6px 0}
.meta{color:#a5afb9;font-size:14px;line-height:1.65}
.row{border-top:1px solid #2b333c;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.open{background:#29313a;color:#fff}.download{background:#fff;color:#111}
.small{font-size:12px;color:#89949f;line-height:1.65}
</style>
</head>
<body>
<main class="wrap">
<h1>王的解析</h1>
<div class="sub">
V8 Stable Free：不再把抖音/小红书的候选 CDN 地址伪装成“解析成功”。公开直链和可验证平台正常下载；受限平台改用官方页面 + 系统授权录屏保存。
</div>

<section class="card">
<textarea id="txt" placeholder="粘贴分享链接或完整分享文案"></textarea>

<div class="toolbar">
  <button id="clearBtn" class="tool">清空</button>
  <button id="pasteBtn" class="tool">粘贴最新链接</button>
</div>

<button id="go" class="primary">开始处理</button>

<div>
  <span class="badge">抖音·官方页/录屏</span>
  <span class="badge">小红书·官方页/录屏</span>
  <span class="badge">B站·云端辅助</span>
  <span class="badge">快手·云端辅助</span>
  <span class="badge">公开直链·下载</span>
</div>

<div class="tip">
核心规则：只有通过真实性校验的直接媒体才允许下载；抖音/小红书不再展示 0:00 假视频。系统录屏需要 Android 自己弹窗授权。
</div>

<div class="small" style="margin-top:10px">
只处理公开可访问且你有权保存的内容；不会绕过登录、验证码、DRM 或访问控制。
</div>
</section>

<section id="status" class="card hidden"></section>
<section id="result" class="card hidden"></section>
</main>

<script>
const SERVER='https://video-collector-0d1n.onrender.com';

const txt=document.getElementById('txt');
const go=document.getElementById('go');
const clearBtn=document.getElementById('clearBtn');
const pasteBtn=document.getElementById('pasteBtn');
const status=document.getElementById('status');
const result=document.getElementById('result');

let busy=false;

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

function js(v){
  return String(v??'')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r/g,'')
    .replace(/\n/g,' ');
}

function firstUrl(text){
  const m=String(text||'').match(/https?:\/\/[^\s，。；;）),]+/i);
  return m?m[0]:'';
}

function platform(url){
  const l=url.toLowerCase();
  if(l.includes('douyin.com')||l.includes('iesdouyin.com')) return 'douyin';
  if(l.includes('xiaohongshu.com')||l.includes('xhslink.')) return 'xhs';
  if(l.includes('bilibili.com')||l.includes('b23.tv')) return 'bili';
  if(l.includes('kuaishou.com')||l.includes('v.kuaishou.com')) return 'kuaishou';
  if(/\.(mp4|webm|mov|mkv|mp3|m4a|aac|wav|ogg)(\?|#|$)/i.test(url)) return 'direct';
  return 'other';
}

function showStatus(msg,cls='status'){
  status.className='card '+cls;
  status.textContent=msg;
}

function hideStatus(){
  status.className='card hidden';
  status.textContent='';
}

function setBusy(v){
  busy=v;
  go.disabled=v;
  go.textContent=v?'正在处理…':'开始处理';
}

clearBtn.onclick=()=>{
  txt.value='';
  hideStatus();
  result.className='card hidden';
  result.innerHTML='';
};

pasteBtn.onclick=async()=>{
  let value='';
  if(window.AndroidClipboard&&AndroidClipboard.getText){
    try{value=AndroidClipboard.getText()||'';}catch(e){}
  }
  if(!value&&navigator.clipboard){
    try{value=await navigator.clipboard.readText();}catch(e){}
  }
  if(!value){
    showStatus('剪贴板里没有可粘贴的内容。','err');
    return;
  }
  txt.value=value.trim();
  hideStatus();
  result.className='card hidden';
  result.innerHTML='';
};

function renderRestricted(name,url){
  hideStatus();
  result.className='card';
  result.innerHTML=`
    <div class="title">${esc(name)}：稳定模式</div>
    <div class="warn">
      当前免费版不再尝试伪造平台内部 CDN 直链。原因是这类地址可能被登录态、会话、风控或分段播放保护，之前会出现 0:00 / 白屏 / 下载失败。
    </div>

    <button class="action dark"
      onclick="AndroidExternal.open('${js(url)}')">
      仅打开官方页面
    </button>

    <button class="action red"
      onclick="AndroidScreenRecorder.start('${js(url)}')">
      系统授权录屏并打开官方页面
    </button>

    <button class="action green"
      onclick="AndroidScreenRecorder.stop()">
      停止录屏并保存
    </button>

    <div class="tip">
      录屏流程：点“系统授权录屏” → Android 弹窗确认 → 自动打开官方页面/App → 播放你要保存的内容 → 完成后回到“王的解析”点停止，或用通知里的“停止并保存”。
    </div>

    <div class="small" style="margin-top:10px">
      录屏文件保存到 Movies/WangParser/ScreenRecords，并通过 MediaStore 进入相册。若授权了麦克风，会录环境/扬声器声音；这不等于抓取平台内部音频。源 App 若禁止系统录屏，可能得到黑屏，这是平台/系统限制，本工具不会绕过。
    </div>
  `;
}

function renderDirect(url){
  hideStatus();
  const ext=(url.match(/\.([a-z0-9]{2,5})(?:\?|#|$)/i)||[])[1]||'mp4';
  const isAudio=/^(mp3|m4a|aac|wav|ogg)$/i.test(ext);
  const filename=(isAudio?'音频_':'视频_')+Date.now()+'.'+ext;

  result.className='card';
  result.innerHTML=`
    <div class="title">公开媒体直链</div>
    <div class="ok">这个链接本身就是媒体地址。下载前 APP 仍会对视频做真实性校验。</div>
    <div class="row">
      <div class="meta">${esc(ext.toUpperCase())}</div>
      <div class="actions">
        <a class="btn open" href="${esc(url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn download"
          onclick="AndroidDownloader.download('${js(url)}','${js(filename)}','')">下载</button>
      </div>
    </div>
  `;
}

function renderCloud(data){
  const d=data.data||data;
  const vids=d.videos||[];
  const audios=d.audios||[];
  const referer=d.referer||d.resolved_url||d.source_url||'';

  const videoRows=vids.map((f,i)=>`
    <div class="row">
      <div>
        <div>${esc(f.quality||'视频')}</div>
        <div class="small">${esc(f.ext||'mp4')}</div>
      </div>
      <div class="actions">
        <a class="btn open" href="${esc(f.url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn download"
          onclick="AndroidDownloader.download(
            '${js(f.url)}',
            '${js((d.title||'video')+'_'+(i+1)+'.'+(f.ext||'mp4'))}',
            '${js(referer)}'
          )">下载</button>
      </div>
    </div>
  `).join('');

  const audioRows=audios.map((a,i)=>`
    <div class="row">
      <div>
        <div>${esc(a.quality||'音频')}</div>
        <div class="small">${esc(a.ext||'mp3')}</div>
      </div>
      <div class="actions">
        <a class="btn open" href="${esc(a.url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn download"
          onclick="AndroidDownloader.download(
            '${js(a.url)}',
            '${js((d.title||'audio')+'_音频_'+(i+1)+'.'+(a.ext||'mp3'))}',
            '${js(referer)}'
          )">下载</button>
      </div>
    </div>
  `).join('');

  result.className='card';
  result.innerHTML=`
    <div class="title">${esc(d.title||'解析结果')}</div>
    <div class="meta">平台：${esc(d.platform||'Cloud')}</div>
    <div class="tip">这里不预览候选视频；只有你点击下载后，通过 APP 的媒体真实性校验才会真正保存。</div>
    ${videoRows}
    ${audioRows}
    ${!vids.length&&!audios.length?'<div class="warn">没有发现经过解析的媒体地址。</div>':''}
  `;
}

async function parseCloud(text){
  showStatus('正在使用云端辅助解析…','status');

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),20000);

    let r;
    try{
      r=await fetch(SERVER+'/api/parse',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text}),
        signal:controller.signal
      });
    }finally{
      clearTimeout(timer);
    }

    const raw=await r.text();
    let j=null;
    try{j=raw?JSON.parse(raw):null;}catch(e){}

    if(!r.ok||!j) throw new Error('云端没有返回有效结果');

    if(!j.success){
      showStatus(j.error||'云端解析失败','err');
      return;
    }

    hideStatus();
    renderCloud(j);

  }catch(e){
    showStatus(
      e&&e.name==='AbortError'
        ? '云端辅助解析超过 20 秒，已停止。'
        : '云端请求失败：'+e.message,
      'err'
    );
  }finally{
    setBusy(false);
  }
}

go.onclick=()=>{
  if(busy)return;

  const text=txt.value.trim();
  if(!text){
    showStatus('请先粘贴分享链接或分享文案。','err');
    return;
  }

  const url=firstUrl(text);
  if(!url){
    showStatus('没有识别到有效链接。','err');
    return;
  }

  result.className='card hidden';
  result.innerHTML='';
  setBusy(true);

  const p=platform(url);

  if(p==='douyin'){
    setBusy(false);
    renderRestricted('抖音',url);
    return;
  }

  if(p==='xhs'){
    setBusy(false);
    renderRestricted('小红书',url);
    return;
  }

  if(p==='direct'){
    setBusy(false);
    renderDirect(url);
    return;
  }

  parseCloud(text);
};
</script>
</body>
</html>
