plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videocollector.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.videocollector.app"
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName "9.0.0-diag"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
