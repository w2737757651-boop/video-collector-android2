plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videocollector.app'
    compileSdk 35

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }

    defaultConfig {
        applicationId "com.videocollector.app"
        minSdk 23
        targetSdk 35
        versionCode 20
        versionName "8.0.0"
    }
}

dependencies {
}
