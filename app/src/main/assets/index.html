<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>王的解析</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:22px 16px 100px}
h1{font-size:34px;margin:0 0 8px}
.sub{color:#9aa4ae;line-height:1.7;margin-bottom:18px}
.card{background:#181d23;border:1px solid #2a333c;border-radius:18px;padding:16px;margin-bottom:14px}
textarea{width:100%;height:160px;border:1px solid #36414c;border-radius:14px;background:#0f1317;color:#fff;padding:14px;font-size:16px;resize:vertical}
button,.btn{border:0;border-radius:12px;min-height:48px;padding:0 15px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.toolbar{display:flex;gap:10px;margin-top:12px}
.tool{flex:1;background:#29323b;color:#fff}
.primary{width:100%;background:#fff;color:#111;margin-top:12px}
.primary:disabled{opacity:.55}
.fallback{width:100%;background:#ff3158;color:#fff;margin-top:14px}
.badge{display:inline-block;padding:5px 9px;background:#242c34;border-radius:20px;margin:10px 4px 0 0;color:#aeb8c2;font-size:12px}
.muted{color:#89949f;font-size:13px;line-height:1.65}
.hidden{display:none}
.err{color:#ff9292;white-space:pre-wrap;line-height:1.7}
.status{color:#d4dde5;white-space:pre-wrap;line-height:1.7}
.video{display:block;width:100%;max-height:560px;background:#000;border-radius:14px}
.title{font-size:19px;font-weight:700;line-height:1.45;margin:12px 0 5px}
.meta{color:#a5afb9;font-size:14px;line-height:1.65}
.sectionTitle{font-size:17px;font-weight:700;margin:18px 0 5px}
.row{border-top:1px solid #2b333c;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.audioRow{border-top:1px solid #2b333c;padding:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.open{background:#29313a;color:#fff}.download{background:#fff;color:#111}
audio{width:100%;margin-top:10px}
.mode{font-size:12px;color:#7fd3a4;margin-top:10px}
.tip{background:#202832;border-radius:12px;padding:12px;margin-top:12px;color:#b8c2cc;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
<h1>王的解析</h1>
<div class="sub">
V7.1 Free Hybrid：小红书加强短链/SSR识别；抖音先走手机本地 Go，触发平台风控时可使用当前手机网页会话免费兜底。
</div>

<section class="card">
<textarea id="txt" placeholder="粘贴抖音 / 小红书 / B站等分享链接或完整分享文案"></textarea>

<div class="toolbar">
  <button id="clearBtn" class="tool">清空</button>
  <button id="pasteBtn" class="tool">粘贴最新链接</button>
</div>

<button id="go" class="primary">开始解析</button>

<div>
  <span class="badge">抖音·Go+网页会话</span>
  <span class="badge">小红书·Go短链增强</span>
  <span class="badge">B站·云端辅助</span>
  <span class="badge">快手·云端辅助</span>
  <span class="badge">视频号·受限</span>
  <span class="badge">视频/音频</span>
</div>

<div class="tip">
抖音若出现 DOUYIN_WALLED，不再只让你反复切网络：APP 会提供“网页会话继续解析”。打开真实抖音页后先让视频开始播放，再点顶部“提取当前媒体”。
</div>

<div class="muted" style="margin-top:10px">
只处理公开可访问且你有权保存的内容；不会自动绕过登录、验证码、DRM 或访问控制。
</div>
</section>

<section id="status" class="card hidden"></section>
<section id="result" class="card hidden"></section>
</main>

<script>
const SERVER='https://video-collector-0d1n.onrender.com';

const txt=document.getElementById('txt');
const go=document.getElementById('go');
const clearBtn=document.getElementById('clearBtn');
const pasteBtn=document.getElementById('pasteBtn');
const status=document.getElementById('status');
const result=document.getElementById('result');

let busy=false;

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

function showStatus(msg,cls='status'){
  status.className='card '+cls;
  status.textContent=msg;
}

function hideStatus(){
  status.className='card hidden';
  status.textContent='';
}

function setBusy(v){
  busy=v;
  go.disabled=v;
  go.textContent=v?'正在解析…':'开始解析';
}

function firstUrl(text){
  const m=String(text||'').match(/https?:\/\/[^\s，。；;）),]+/i);
  return m?m[0]:'';
}

function localPlatform(url){
  const l=url.toLowerCase();
  return l.includes('douyin.com')
      || l.includes('iesdouyin.com')
      || l.includes('xiaohongshu.com')
      || l.includes('xhslink.');
}

clearBtn.onclick=()=>{
  txt.value='';
  hideStatus();
  result.className='card hidden';
  result.innerHTML='';
};

pasteBtn.onclick=async()=>{
  let value='';

  if(window.AndroidClipboard&&AndroidClipboard.getText){
    try{ value=AndroidClipboard.getText()||''; }catch(e){}
  }

  if(!value&&navigator.clipboard){
    try{ value=await navigator.clipboard.readText(); }catch(e){}
  }

  if(!value){
    showStatus('剪贴板里没有可粘贴的内容。','err');
    return;
  }

  txt.value=value.trim();
  hideStatus();
  result.className='card hidden';
  result.innerHTML='';
};

function showDouyinFallback(data){
  status.className='card err';
  status.innerHTML='';

  const p=document.createElement('div');
  p.textContent=(data&&data.error?data.error:'抖音当前本地接口被平台风控。')
    +(data&&data.code?'\n\n错误代码：'+data.code:'');
  p.style.whiteSpace='pre-wrap';
  status.appendChild(p);

  const b=document.createElement('button');
  b.className='fallback';
  b.textContent='使用网页会话继续解析（免费）';
  b.onclick=()=>{
    const source=(data&&data.source_url)||txt.value;
    if(window.AndroidBrowserSession&&AndroidBrowserSession.open){
      AndroidBrowserSession.open(source);
    }
  };
  status.appendChild(b);

  const tip=document.createElement('div');
  tip.className='muted';
  tip.style.marginTop='10px';
  tip.textContent='进入抖音网页后：先点播放 → 确认视频已经动起来 → 点顶部“提取当前媒体”。';
  status.appendChild(tip);
}

window.onNativeParseResult=(data)=>{
  setBusy(false);

  if(!data||!data.success){
    if(data&&data.code==='DOUYIN_WALLED'){
      showDouyinFallback(data);
      return;
    }

    const code=data&&data.code?`\n\n错误代码：${data.code}`:'';
    showStatus((data&&data.error?data.error:'本地解析失败')+code,'err');
    return;
  }

  hideStatus();
  renderResult(data,true);
};

window.onBrowserMediaError=(msg)=>{
  showStatus(msg,'err');
};

window.onBrowserMediaResult=(data)=>{
  setBusy(false);
  hideStatus();
  renderResult(data,true);
};

function appDownload(url,filename,referer){
  if(window.AndroidDownloader&&AndroidDownloader.download){
    AndroidDownloader.download(url,filename||'download',referer||'');
  }else{
    location.href=url;
  }
}

function appDownloadSession(url,filename,referer){
  if(window.AndroidDownloader&&AndroidDownloader.downloadSession){
    AndroidDownloader.downloadSession(url,filename||'download',referer||'');
  }else{
    appDownload(url,filename,referer);
  }
}

function safeJs(v){
  return String(v??'')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r/g,'')
    .replace(/\n/g,' ');
}

function renderResult(data,isLocal){
  const d=data.data||data;
  const vids=d.videos||[];
  const audios=d.audios||[];
  const referer=d.referer||d.resolved_url||d.source_url||'';
  const session=!!d.session_download;

  const first=vids[0];

  const preview=first&&first.url
    ? `<video class="video" controls playsinline preload="metadata"><source src="${esc(first.url)}"></video>`
    : '';

  const videoRows=vids.map((f,i)=>`
    <div class="row">
      <div>
        <div>${esc(f.quality||'视频')}</div>
        <div class="muted">${esc(f.ext||'mp4')}</div>
      </div>
      <div class="actions">
        <a class="btn open" href="${esc(f.url)}" target="_blank" rel="noopener">打开</a>
        <button class="btn download"
          onclick="${session?'appDownloadSession':'appDownload'}(
            '${safeJs(f.url)}',
            '${safeJs((d.title||'video')+'_'+(i+1)+'.'+(f.ext||'mp4'))}',
            '${safeJs(referer)}'
          )">下载</button>
      </div>
    </div>
  `).join('');

  const audioRows=audios.map((a,i)=>`
    <div class="audioRow">
      <div class="row" style="border-top:0;padding-top:0">
        <div>
          <div>${esc(a.quality||'音频')}</div>
          <div class="muted">${esc(a.ext||'mp3')}</div>
        </div>
        <div class="actions">
          <a class="btn open" href="${esc(a.url)}" target="_blank" rel="noopener">打开</a>
          <button class="btn download"
            onclick="${session?'appDownloadSession':'appDownload'}(
              '${safeJs(a.url)}',
              '${safeJs((d.title||'audio')+'_音频_'+(i+1)+'.'+(a.ext||'mp3'))}',
              '${safeJs(referer)}'
            )">下载音频</button>
        </div>
      </div>
      <audio controls preload="metadata" src="${esc(a.url)}"></audio>
    </div>
  `).join('');

  result.innerHTML=`
    ${preview}
    <div class="title">${esc(d.title||'未命名内容')}</div>
    <div class="meta">
      ${d.author?'作者：'+esc(d.author)+'<br>':''}
      平台：${esc(d.platform||'Local')}
    </div>
    <div class="mode">${session?'当前手机网页会话':'手机本地 Go 引擎'}</div>
    ${vids.length?`<div class="sectionTitle">视频</div>${videoRows}`:''}
    ${audios.length?`<div class="sectionTitle">音频</div>${audioRows}`:''}
    ${!vids.length&&!audios.length?'<div class="muted" style="margin-top:14px">没有发现可下载的视频或音频。</div>':''}
  `;

  result.className='card';
}

async function parseCloud(text){
  showStatus('该平台正在使用云端辅助解析…','status');

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),20000);

    let r;
    try{
      r=await fetch(
        SERVER+'/api/parse',
        {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text}),
          signal:controller.signal
        }
      );
    }finally{
      clearTimeout(timer);
    }

    const raw=await r.text();
    let j=null;
    try{ j=raw?JSON.parse(raw):null; }catch(e){}

    if(!r.ok||!j) throw new Error('云端没有返回有效结果');

    if(!j.success){
      setBusy(false);
      showStatus(j.error||'云端解析失败','err');
      return;
    }

    setBusy(false);
    hideStatus();
    renderResult(j,false);

  }catch(e){
    setBusy(false);
    showStatus(
      e&&e.name==='AbortError'
        ? '云端辅助解析超时。'
        : '云端请求失败：'+e.message,
      'err'
    );
  }
}

go.onclick=()=>{
  if(busy)return;

  const text=txt.value.trim();

  if(!text){
    showStatus('请先粘贴分享链接或分享文案。','err');
    return;
  }

  const url=firstUrl(text);

  if(!url){
    showStatus('没有识别到有效链接。','err');
    return;
  }

  result.className='card hidden';
  result.innerHTML='';
  setBusy(true);

  if(
    localPlatform(url)
    && window.AndroidNativeParser
    && AndroidNativeParser.parse
  ){
    showStatus('正在调用手机本地解析引擎…','status');
    AndroidNativeParser.parse(text);
  }else{
    parseCloud(text);
  }
};
</script>
</body>
</html>
