name: Build WangParser APK V7.0.3 Free Local

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | bash "$SDKMANAGER" --licenses || true
          bash "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install gomobile toolchain
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Prepare Go module for gomobile
        run: |
          cd nativecore

          # Go 1.24+ / current gomobile requires x/mobile/gobind
          # to be recorded in the CURRENT MODULE dependency graph.
          go get -tool golang.org/x/mobile/cmd/gobind@latest

          go mod tidy

          echo "=== go.mod ==="
          cat go.mod

          echo "=== x/mobile module ==="
          go list -m golang.org/x/mobile

          echo "=== Go compile preflight ==="
          go test ./...

      - name: Build Go Android binding
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs

          cd nativecore

          gomobile bind \
            -target=android/arm64,android/amd64 \
            -androidapi 23 \
            -javapkg com.videocollector.go \
            -trimpath \
            -o ../app/libs/nativecore.aar \
            .

          cd ..

          test -f app/libs/nativecore.aar

          echo "=== nativecore.aar ==="
          ls -lh app/libs/nativecore.aar
          unzip -l app/libs/nativecore.aar | sed -n '1,180p'

      - name: Extract clean Go classes and JNI libraries
        run: |
          rm -rf /tmp/nativecore-aar
          rm -rf /tmp/nativecore-classes
          mkdir -p /tmp/nativecore-aar
          mkdir -p /tmp/nativecore-classes

          unzip -q app/libs/nativecore.aar -d /tmp/nativecore-aar
