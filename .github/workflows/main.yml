name: Build Android APK V7.0.2 Free Local

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | bash "$SDKMANAGER" --licenses || true
          bash "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Go Android binding
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs

          cd nativecore
          go mod tidy

          gomobile bind \
            -target=android/arm64,android/amd64 \
            -androidapi 23 \
            -javapkg com.videocollector.go \
            -trimpath \
            -o ../app/libs/nativecore.aar \
            .

          cd ..

          echo "=== nativecore.aar contents ==="
          unzip -l app/libs/nativecore.aar

      - name: Extract Go classes and JNI libraries
        run: |
          rm -rf /tmp/nativecore-aar
          mkdir -p /tmp/nativecore-aar

          unzip -q app/libs/nativecore.aar -d /tmp/nativecore-aar

          test -f /tmp/nativecore-aar/classes.jar

          rm -rf /tmp/nativecore-classes
          mkdir -p /tmp/nativecore-classes

          cd /tmp/nativecore-classes
          jar xf /tmp/nativecore-aar/classes.jar

          echo "=== Original Java resources ==="
          find . -type f ! -name '*.class' -print || true

          # Keep only Java bytecode.
          # gomobile binding does not need META-INF/LICENSE/NOTICE/etc at runtime.
          find . -type f ! -name '*.class' -delete
          find . -type d -empty -delete || true

          jar cf "$GITHUB_WORKSPACE/app/libs/nativecore-classes.jar" .

          cd "$GITHUB_WORKSPACE"

          echo "=== Clean binding JAR contents ==="
          jar tf app/libs/nativecore-classes.jar | sed -n '1,160p'
